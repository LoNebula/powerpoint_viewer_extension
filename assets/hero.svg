<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#050816" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>
    <linearGradient id="nebula" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0" />
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)" />
  <ellipse cx="600" cy="210" rx="550" ry="160" fill="url(#nebula)" transform="rotate(-8 600 210)" />

  <g opacity="0.12" stroke="#94a3b8" stroke-width="1" fill="none">
    <circle cx="600" cy="180" r="120" stroke-dasharray="4 6" />
    <circle cx="600" cy="180" r="200" />
    <circle cx="600" cy="180" r="280" stroke-dasharray="2 8" />
    <ellipse cx="600" cy="180" rx="360" ry="80" transform="rotate(20 600 180)" />
  </g>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="150" cy="80" r="1.5" /><circle cx="320" cy="120" r="1.2" />
    <circle cx="1050" cy="90" r="1.5" /><circle cx="920" cy="140" r="1.0" />
    <circle cx="180" cy="320" r="1.2" /><circle cx="1020" cy="310" r="1.5" />
  </g>

  <!-- Title & Typography -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">
    <text x="600" y="195" font-size="42" font-weight="900" letter-spacing="2" fill="#ffffff" filter="url(#glow)">
      📊 PowerPoint Viewer for VS Code
    </text>
    
    <text x="600" y="245" font-size="16" font-weight="500" letter-spacing="1" fill="#cbd5e1">
      Directly preview PowerPoint files (.pptx) inside VS Code with high-fidelity slide rendering, continu
    </text>
    
    <g transform="translate(600, 310)" font-size="12" font-weight="700" letter-spacing="1">
      <rect x="-180" y="-14" width="160" height="28" rx="14" fill="#1e293b" stroke="#d97706" stroke-opacity="0.6" />
      <text x="-100" y="5" fill="#d97706">⚡ High Performance</text>

      <rect x="20" y="-14" width="160" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-opacity="0.6" />
      <text x="100" y="5" fill="#3b82f6">🛡️ Production Ready</text>
    </g>
  </g>
</svg>
